apply plugin: 'com.android.application'

// NDK: pinned for reproducible builds; override with -PndkVersion=... if your SDK has another.
def ndkVer = project.hasProperty('ndkVersion') ? project.property('ndkVersion') : '26.3.11579264'

android {
    namespace 'com.sirbilliams.tinkerbell'
    compileSdkVersion 34
    ndkVersion ndkVer

    defaultConfig {
        applicationId 'com.sirbilliams.tinkerbell'
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 100
        versionName '1.0'
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-24'
                abiFilters 'arm64-v8a'        // AYN Thor and every current Android handheld
            }
        }
    }

    // A stable signing key, so each new APK installs over the last one (keeping the game and saves):
    // CI sets NEG_KEYSTORE (+ NEG_KEYSTORE_PASSWORD, NEG_KEY_ALIAS, NEG_KEY_PASSWORD) from the repo
    // secrets (.github/workflows/android.yml). Without it the build uses the SDK debug key, which
    // differs from machine to machine.
    signingConfigs {
        if (System.getenv('NEG_KEYSTORE')) {
            stable {
                storeFile file(System.getenv('NEG_KEYSTORE'))
                storePassword System.getenv('NEG_KEYSTORE_PASSWORD')
                keyAlias System.getenv('NEG_KEY_ALIAS') ?: 'negatron'
                keyPassword System.getenv('NEG_KEY_PASSWORD') ?: System.getenv('NEG_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            // Debug builds are signed (stable key above, else the SDK debug key), so the APK installs directly.
            if (signingConfigs.findByName('stable') != null) signingConfig signingConfigs.stable
            externalNativeBuild { cmake { arguments '-DCMAKE_BUILD_TYPE=RelWithDebInfo' } }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
            version '3.22.1'
        }
    }

    // SDL needs the native libs built before assets are merged
    applicationVariants.all { variant ->
        tasks["merge${variant.name.capitalize()}Assets"]
            .dependsOn("externalNativeBuild${variant.name.capitalize()}")
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
