name: Build

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux desktop build check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev cmake
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build -j"$(nproc)"

  android:
    name: Android APK (arm64)
    runs-on: ubuntu-24.04
    permissions:
      contents: write          # to publish the "latest" release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264" "cmake;3.22.1" > /dev/null

      - name: Fetch SDL2 (pinned)
        run: bash fetch-deps.sh

      # A stable signing key from the repo secrets (if set), so each APK installs over the last one.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.NEG_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NEG_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            PW=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d ' \t\r\n')
            printf '%s' "$KEYSTORE_B64" | tr -d ' \t\r\n' | base64 -d > "$RUNNER_TEMP/tinkerbell.keystore"
            if ! keytool -list -keystore "$RUNNER_TEMP/tinkerbell.keystore" -storepass "$PW" -alias negatron > /dev/null; then
              echo "::error::NEG_KEYSTORE_B64 / NEG_KEYSTORE_PASSWORD don't open the key: re-paste both secrets"
              exit 1
            fi
            echo "NEG_KEYSTORE=$RUNNER_TEMP/tinkerbell.keystore" >> "$GITHUB_ENV"
            echo "NEG_KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
            echo "stable signing key: yes"
          else
            echo "::warning::No NEG_KEYSTORE_B64 secret: signed with a one-off debug key (won't install over an older APK)"
          fi

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Collect APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/TinkerBell.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: TinkerBell-apk
          path: out/TinkerBell.apk
          if-no-files-found: error

      # Every push to main replaces the "latest" pre-release:
      # https://github.com/<owner>/<repo>/releases/download/latest/TinkerBell.apk
      - name: Publish as the latest build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/TinkerBell.apk --prerelease --target "$GITHUB_SHA" \
            --title "Latest build ($(date -u +%Y-%m-%d) ${GITHUB_SHA::7})" \
            --notes "Built automatically from ${GITHUB_SHA::7}: $(git log -1 --format=%s)"
